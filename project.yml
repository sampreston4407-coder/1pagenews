name: OnePageNews
options:
  bundleIdPrefix: com.sampreston
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  OnePageNews:
    type: application
    platform: iOS
    sources:
      - path: OnePageNews
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sampreston.onepagenews
        PRODUCT_NAME: OnePageNews
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 1Page
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ENABLE_PREVIEWS: YES

  OnePageNewsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OnePageNewsTests
    dependencies:
      - target: OnePageNews
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sampreston.onepagenews.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  OnePageNews:
    build:
      targets:
        OnePageNews: all
        OnePageNewsTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OnePageNewsTests
    archive:
      config: Release
