name: OnePageNews
options:
  bundleIdPrefix: com.sampreston
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  OnePageNews:
    type: application
    platform: iOS
    sources:
      - path: OnePageNews
      - path: Shared
    dependencies:
      - target: OnePageWidget
    entitlements:
      path: OnePageNews/OnePageNews.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.sampreston.onepagenews
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sampreston.onepagenews
        PRODUCT_NAME: OnePageNews
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 1Page
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ENABLE_PREVIEWS: YES

  OnePageWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: OnePageWidget
      - path: Shared
      - path: OnePageNews/Resources/FixtureEdition.json
    entitlements:
      path: OnePageWidget/OnePageWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.sampreston.onepagenews
    info:
      path: OnePageWidget/Info.plist
      properties:
        CFBundleDisplayName: 1Page
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sampreston.onepagenews.widget
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SKIP_INSTALL: YES

  OnePageNewsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OnePageNewsTests
    dependencies:
      - target: OnePageNews
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sampreston.onepagenews.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  OnePageNews:
    build:
      targets:
        OnePageNews: all
        OnePageWidget: all
        OnePageNewsTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OnePageNewsTests
    archive:
      config: Release
